# ABOUTME: conftest verify fixture for the onprem package: compose long form bound.
# ABOUTME: Fake services and images only.
---
# The shape `docker compose config --format json` emits (the input CI feeds
# conftest): ports in long form with host_ip set to a specific address.
compose_long_form_bound:
  services:
    app:
      image: ghcr.io/psd401/app:1.4.2
      restart: unless-stopped
      ports:
        - target: 8080
          published: "8080"
          host_ip: 127.0.0.1
          protocol: tcp
      cap_drop:
        - ALL
      security_opt:
        - "no-new-privileges:true"
      read_only: true
      user: "10001:10001"
