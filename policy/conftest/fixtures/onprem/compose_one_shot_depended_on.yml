# ABOUTME: conftest verify fixture for the onprem package: compose one shot depended on.
# ABOUTME: Fake services and images only.
---
compose_one_shot_depended_on:
  services:
    app:
      image: ghcr.io/psd401/app:1.4.2
      restart: unless-stopped
      depends_on:
        db-init:
          condition: service_healthy
    db-init:
      image: ghcr.io/psd401/app:1.4.2
      restart: "no"
