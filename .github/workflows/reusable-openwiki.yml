# Reusable OpenWiki update — the org-standard self-maintaining wiki job.
# THIS FILE OWNS THE OPENWIKI VERSION PIN for the whole org. Bump it here,
# every repo follows on its next run. (Kills the per-repo 0.2.0 drift.)
#
# Ported from aistudio's hardened openwiki-update.yml, preserving its guards:
# graceful secret gate, persist-credentials off while LLM-driven code runs,
# full-fetch for --update's gitHead diff, telemetry off, SHA-pinned PR action,
# add-paths cap so generated content can't touch anything but openwiki/.
#
# LLM serving: Amazon Bedrock with the org BEDROCK_API_KEY (spend lands on
# the district AWS account). The provider follows model_id:
# - Claude (default, us.anthropic.claude-haiku-5-5): OpenWiki's anthropic
#   provider against Bedrock's Anthropic-compatible endpoint. Bedrock's
#   OpenAI-compatible endpoint returns model_not_found for Claude, and as of
#   2026-10-07 the Anthropic-compatible one accepts the request-top-level
#   cache_control that it used to reject (psd-dev-standards
#   audit/openwiki-2026-10-07.md).
# - Anything else (e.g. zai.glm-5): Bedrock's OpenAI-compatible endpoint.
# Use a us.* inference profile for Claude: on-demand foundation-model IDs are
# rejected and the global.* profile is denied by the org SCP.
#
# Version pin: openwiki_version below. A weekly job in this repo
# (openwiki-version-check.yml) opens an issue when npm has a newer release, and
# openwiki-smoke.yml runs this workflow against psd-standards-canary on the
# bump PR before anyone merges it.
#
# Caller prerequisites: BEDROCK_API_KEY + PSD_AUTOMATION_APP_PRIVATE_KEY org
# secrets (call with `secrets: inherit`). PR creation and self-merge run as
# the psd-automation GitHub App — the org 'Actions can create/approve PRs'
# toggle stays OFF (it only gates GITHUB_TOKEN); auditable bot identity per
# standards/02 single-purpose-identity doctrine.
name: Reusable OpenWiki Update

on:
  workflow_call:
    inputs:
      base_branch:
        description: "Branch the wiki is generated from and PR'd against (repo default branch)"
        type: string
        required: true
      model_id:
        description: "Bedrock model or inference-profile ID. Claude IDs use the Anthropic-compatible endpoint; others use the OpenAI-compatible one"
        type: string
        default: "us.anthropic.claude-haiku-5-5"
      openwiki_version:
        description: "Override the org pin ONLY for testing a new release"
        type: string
        # 0.7.1 + Claude Haiku 5.5 fails on repos that already have a wiki:
        # "Repository planning worker exited without submit_plan" (all four
        # repos that ran on 2026-10-08). 0.3.3 + Haiku 5.5 passes. Stay here
        # until a newer release passes both smoke-test cases.
        default: "0.3.3"
      auto_merge:
        description: "Merge the docs PR immediately without human review (docs-only, add-paths capped — the safe-to-automate class per standards/09)"
        type: boolean
        default: true
      repository:
        description: "Repo to document (default: the caller). The smoke test uses psd401/psd-standards-canary"
        type: string
        default: ""
      dry_run:
        description: "Generate and verify the wiki, but open no PR (smoke test)"
        type: boolean
        default: false
      from_scratch:
        description: "Delete openwiki/ before the run to test a first build (smoke test only; needs dry_run)"
        type: boolean
        default: false

concurrency:
  group: openwiki-update-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    name: openwiki-update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check provider secret
        id: gate
        env:
          BEDROCK_KEY: ${{ secrets.BEDROCK_API_KEY }}
        run: |
          if [ -z "$BEDROCK_KEY" ]; then
            echo "BEDROCK_API_KEY not configured — skipping OpenWiki update."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint automation app token
        if: steps.gate.outputs.configured == 'true' && !inputs.dry_run
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PSD_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
          # Downscope: this job needs docs-write only, never the app's
          # security-read grants (zizmor github-app audit).
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.base_branch }}
          # Full history: --update diffs from the gitHead recorded in
          # openwiki/.last-update.json; depth-1 strands it after the first PR.
          fetch-depth: 0
          # No GITHUB_TOKEN in .git/config while LLM-driven code runs.
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install OpenWiki (org-pinned)
        if: steps.gate.outputs.configured == 'true'
        # No --ignore-scripts: better-sqlite3 needs its native build. Risk is
        # bounded by job-scoped token, human-reviewed PR, and add-paths cap.
        env:
          OW_VERSION: ${{ inputs.openwiki_version }}
        run: npm install --global "openwiki@${OW_VERSION}"

      - name: Remove existing wiki (from-scratch smoke test)
        if: steps.gate.outputs.configured == 'true' && inputs.dry_run && inputs.from_scratch
        run: rm -rf openwiki

      - name: Run OpenWiki
        if: steps.gate.outputs.configured == 'true'
        env:
          OPENWIKI_MODEL_ID: ${{ inputs.model_id }}
          BEDROCK_KEY: ${{ secrets.BEDROCK_API_KEY }}
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          case "$OPENWIKI_MODEL_ID" in
            *anthropic.claude*)
              export OPENWIKI_PROVIDER=anthropic
              export ANTHROPIC_BASE_URL=https://bedrock-runtime.us-west-2.amazonaws.com/anthropic
              export ANTHROPIC_API_KEY="$BEDROCK_KEY"
              ;;
            *)
              export OPENWIKI_PROVIDER=openai-compatible
              export OPENAI_COMPATIBLE_BASE_URL=https://bedrock-runtime.us-west-2.amazonaws.com/openai/v1
              export OPENAI_COMPATIBLE_API_KEY="$BEDROCK_KEY"
              ;;
          esac
          openwiki code --update --print

      # openwiki can exit 0 without finishing; never open a PR for a partial wiki.
      - name: Verify the run completed
        if: steps.gate.outputs.configured == 'true'
        env:
          OPENWIKI_MODEL_ID: ${{ inputs.model_id }}
        run: |
          meta=openwiki/.last-update.json
          test -f "$meta" || { echo "::error::$meta missing after the run"; exit 1; }
          jq . "$meta"
          status=$(jq -r .status "$meta")
          [ "$status" = complete ] || { echo "::error::OpenWiki status is '$status', expected 'complete'"; exit 1; }
          pages=$(find openwiki -name '*.md' | wc -l | tr -d ' ')
          echo "OpenWiki: $pages pages, model $(jq -r .model "$meta"), gitHead $(jq -r .gitHead "$meta")" >> "$GITHUB_STEP_SUMMARY"

      - name: Create OpenWiki update pull request
        if: steps.gate.outputs.configured == 'true' && !inputs.dry_run
        id: docs-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ inputs.base_branch }}
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update via the org reusable
            workflow (PSD401/.github → reusable-openwiki.yml, openwiki@${{ inputs.openwiki_version }}, model ${{ inputs.model_id }}).
            Scoped to `openwiki/` only.

      # Docs flow all the way through: the PR satisfies PR-required rulesets,
      # and this step removes the human-merge toll for a change class our
      # auto-remediation matrix already rates safe (docs-only, path-capped).
      # If a ruleset demands human approval (Tier A after activation), the
      # merge fails gracefully and the PR simply waits — surfaced weekly by
      # the security digest's stale-PR list.
      - name: Auto-merge docs PR
        if: steps.gate.outputs.configured == 'true' && inputs.auto_merge && steps.docs-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.docs-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            || echo "::warning::Docs PR #$PR could not auto-merge (likely a required review on this tier) — left open for human merge."
