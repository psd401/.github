# Reusable OpenWiki update — the org-standard self-maintaining wiki job.
# THIS FILE OWNS THE OPENWIKI VERSION PIN for the whole org. Bump it here,
# every repo follows on its next run. (Kills the per-repo 0.2.0 drift.)
#
# Ported from aistudio's hardened openwiki-update.yml, preserving its guards:
# graceful secret gate, persist-credentials off while LLM-driven code runs,
# full-fetch for --update's gitHead diff, telemetry off, SHA-pinned PR action,
# add-paths cap so generated content can't touch anything but openwiki/.
#
# LLM serving: Amazon Bedrock with the org BEDROCK_API_KEY (spend lands on
# the district AWS account). The provider follows model_id:
# - Claude (default, us.anthropic.claude-haiku-5-5): OpenWiki's anthropic
#   provider against Bedrock's Anthropic-compatible endpoint. Bedrock's
#   OpenAI-compatible endpoint returns model_not_found for Claude, and as of
#   2026-10-07 the Anthropic-compatible one accepts the request-top-level
#   cache_control that it used to reject (psd-dev-standards
#   audit/openwiki-2026-10-07.md).
# - Anything else (e.g. zai.glm-5): Bedrock's OpenAI-compatible endpoint.
# Use a us.* inference profile for Claude: on-demand foundation-model IDs are
# rejected and the global.* profile is denied by the org SCP.
#
# Version pin: openwiki_version below. A weekly job in this repo
# (openwiki-version-check.yml) opens an issue when npm has a newer release, and
# openwiki-smoke.yml runs this workflow against psd-standards-canary on the
# bump PR before anyone merges it.
#
# Caller prerequisites: BEDROCK_API_KEY + PSD_AUTOMATION_APP_PRIVATE_KEY org
# secrets (call with `secrets: inherit`). PR creation and self-merge run as
# the psd-automation GitHub App — the org 'Actions can create/approve PRs'
# toggle stays OFF (it only gates GITHUB_TOKEN); auditable bot identity per
# standards/02 single-purpose-identity doctrine.
name: Reusable OpenWiki Update

on:
  workflow_call:
    inputs:
      base_branch:
        description: "Branch the wiki is generated from and PR'd against (repo default branch)"
        type: string
        required: true
      model_id:
        description: "Bedrock model or inference-profile ID. Claude IDs use the Anthropic-compatible endpoint; others use the OpenAI-compatible one"
        type: string
        default: "us.anthropic.claude-haiku-5-5"
      first_build_model_id:
        description: "Model for a first build (no openwiki/ yet). Empty = model_id"
        type: string
        # Sonnet 5.5 for first builds: in CI on 2026-10-08, Haiku 5.5 left an
        # empty wiki on 3 of 4 first-build attempts (proxmox-mcp,
        # freshservice-mcp) and on 11 of 14 earlier rollout repos; Sonnet 5.5
        # built both test repos on the first try. Updates stay on model_id.
        default: "us.anthropic.claude-sonnet-5-5"
      openwiki_version:
        description: "Override the org pin ONLY for testing a new release"
        type: string
        # 0.7.1 + Claude Haiku 5.5 fails on repos that already have a wiki:
        # "Repository planning worker exited without submit_plan" (all four
        # repos that ran on 2026-10-08). 0.3.3 + Haiku 5.5 passes. Stay here
        # until a newer release passes both smoke-test cases.
        default: "0.3.3"
      auto_merge:
        description: "Merge the docs PR immediately without human review (docs-only, add-paths capped — the safe-to-automate class per standards/09)"
        type: boolean
        default: true
      repository:
        description: "Repo to document (default: the caller). The smoke test uses psd401/psd-standards-canary"
        type: string
        default: ""
      dry_run:
        description: "Generate and verify the wiki, but open no PR (smoke test)"
        type: boolean
        default: false
      from_scratch:
        description: "Delete openwiki/ before the run to test a first build (smoke test only; needs dry_run)"
        type: boolean
        default: false

concurrency:
  # Smoke-test legs and manual model tests get their own groups, so they don't
  # cancel each other's queued runs (seen on PSD401/.github#8).
  group: openwiki-update-${{ inputs.repository || github.repository }}-${{ inputs.dry_run }}-${{ inputs.from_scratch }}-${{ inputs.first_build_model_id }}
  cancel-in-progress: false

# GITHUB_TOKEN only reads: checkout runs with persist-credentials false, and
# the PR and merge go through the psd-automation App token below. Callers may
# still grant write; a called workflow can always ask for less.
permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    name: openwiki-update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # "configured" gates every later step. It is false when the provider
      # secret is missing, or when a push changed only openwiki/: the
      # auto-merged docs PR is pushed with the App token, which triggers the
      # caller again, so without this each docs merge re-ran the build
      # (psd-standards-canary: 2 extra rounds per change, 2026-10-08; reported
      # by Reese Herber).
      - name: Check provider secret and skip wiki-only pushes
        id: gate
        env:
          BEDROCK_KEY: ${{ secrets.BEDROCK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ inputs.repository || github.repository }}
        run: |
          if [ -z "$BEDROCK_KEY" ]; then
            echo "BEDROCK_API_KEY not configured — skipping OpenWiki update."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ -n "$AFTER" ] \
             && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # compare lists at most 300 files; anything that fails or looks
            # truncated runs the build as usual.
            if files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>/dev/null) \
               && [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] \
               && ! printf '%s\n' "$files" | grep -qv '^openwiki/'; then
              echo "This push changed only openwiki/ — skipping the rebuild." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      # Also used for checkout, so a dry run can read a private target repo
      # (the model test runs from .github against other repos). Scoped to the
      # one target repo; read-only on a dry run.
      - name: Mint automation app token
        if: steps.gate.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PSD_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
          owner: PSD401
          repositories: ${{ steps.gate.outputs.repo_name }}
          # Downscope: docs-write only, never the app's security-read grants
          # (zizmor github-app audit).
          permission-contents: ${{ inputs.dry_run && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.dry_run && 'read' || 'write' }}

      - name: Check out repository
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.base_branch }}
          token: ${{ steps.app-token.outputs.token }}
          # Full history: --update diffs from the gitHead recorded in
          # openwiki/.last-update.json; depth-1 strands it after the first PR.
          fetch-depth: 0
          # No GITHUB_TOKEN in .git/config while LLM-driven code runs.
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install OpenWiki (org-pinned)
        if: steps.gate.outputs.configured == 'true'
        # No --ignore-scripts: better-sqlite3 needs its native build. Risk is
        # bounded by job-scoped token, human-reviewed PR, and add-paths cap.
        env:
          OW_VERSION: ${{ inputs.openwiki_version }}
        run: npm install --global "openwiki@${OW_VERSION}"

      - name: Remove existing wiki (from-scratch smoke test)
        if: steps.gate.outputs.configured == 'true' && inputs.dry_run && inputs.from_scratch
        run: rm -rf openwiki

      # Haiku 5.5 on openwiki 0.3.3 sometimes stops before writing any page
      # yet records status "complete": 11 of 14 first builds in CI on
      # 2026-10-08 left only openwiki/index.md (reported by Reese Herber).
      # A first build that comes out empty is retried once from scratch.
      - name: Run OpenWiki
        id: run
        if: steps.gate.outputs.configured == 'true'
        env:
          MODEL_ID: ${{ inputs.model_id }}
          FIRST_BUILD_MODEL_ID: ${{ inputs.first_build_model_id }}
          BEDROCK_KEY: ${{ secrets.BEDROCK_API_KEY }}
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          first_build=false
          [ -f openwiki/.last-update.json ] || first_build=true
          model="$MODEL_ID"
          if [ "$first_build" = true ] && [ -n "$FIRST_BUILD_MODEL_ID" ]; then model="$FIRST_BUILD_MODEL_ID"; fi
          export OPENWIKI_MODEL_ID="$model"
          case "$model" in
            *anthropic.claude*)
              export OPENWIKI_PROVIDER=anthropic
              export ANTHROPIC_BASE_URL=https://bedrock-runtime.us-west-2.amazonaws.com/anthropic
              export ANTHROPIC_API_KEY="$BEDROCK_KEY"
              ;;
            *)
              export OPENWIKI_PROVIDER=openai-compatible
              export OPENAI_COMPATIBLE_BASE_URL=https://bedrock-runtime.us-west-2.amazonaws.com/openai/v1
              export OPENAI_COMPATIBLE_API_KEY="$BEDROCK_KEY"
              ;;
          esac
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "first_build=$first_build" >> "$GITHUB_OUTPUT"
          openwiki code --update --print
          pages=$(find openwiki -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$first_build" = true ] && [ "$pages" -le 2 ]; then
            echo "::warning::First build produced $pages page(s) with $model; retrying once from scratch."
            rm -rf openwiki
            openwiki code --update --print
          fi

      # openwiki can exit 0 without finishing; never open a PR for a partial wiki.
      - name: Verify the run completed
        if: steps.gate.outputs.configured == 'true'
        env:
          FIRST_BUILD: ${{ steps.run.outputs.first_build }}
        run: |
          meta=openwiki/.last-update.json
          test -f "$meta" || { echo "::error::$meta missing after the run"; exit 1; }
          jq . "$meta"
          status=$(jq -r .status "$meta")
          [ "$status" = complete ] || { echo "::error::OpenWiki status is '$status', expected 'complete'"; exit 1; }
          pages=$(find openwiki -name '*.md' | wc -l | tr -d ' ')
          echo "OpenWiki: $pages pages (first build: $FIRST_BUILD), model $(jq -r .model "$meta"), gitHead $(jq -r .gitHead "$meta")" >> "$GITHUB_STEP_SUMMARY"
          # status says "complete" even when no page was written; an index
          # alone is not a wiki.
          [ "$pages" -gt 2 ] || { echo "::error::OpenWiki wrote only $pages page(s); not opening a PR for an empty wiki."; exit 1; }

      - name: Create OpenWiki update pull request
        if: steps.gate.outputs.configured == 'true' && !inputs.dry_run
        id: docs-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ inputs.base_branch }}
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update via the org reusable
            workflow (PSD401/.github → reusable-openwiki.yml, openwiki@${{ inputs.openwiki_version }}, model ${{ steps.run.outputs.model }}).
            Scoped to `openwiki/` only.

      # Docs flow all the way through: the PR satisfies PR-required rulesets,
      # and this step removes the human-merge toll for a change class our
      # auto-remediation matrix already rates safe (docs-only, path-capped).
      # If a ruleset demands human approval (Tier A after activation), the
      # merge fails gracefully and the PR simply waits — surfaced weekly by
      # the security digest's stale-PR list.
      - name: Auto-merge docs PR
        if: steps.gate.outputs.configured == 'true' && inputs.auto_merge && steps.docs-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.docs-pr.outputs.pull-request-number }}
        # Merge now if GitHub allows it. In repos with required status checks
        # the checks haven't run yet, so GitHub refuses (reported by Mason
        # Pratz on classlink-mcp #18, 2026-10-08); then queue an auto-merge,
        # which needs the repo setting "Allow auto-merge". If neither works
        # (setting off, or a required review), the PR stays open.
        run: |
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
            exit 0
          fi
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto; then
            echo "Docs PR #$PR will merge when its required checks pass." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Docs PR #$PR could not merge now or queue auto-merge (repo setting 'Allow auto-merge' off, or a required review) — left open for a human to merge."
          fi
