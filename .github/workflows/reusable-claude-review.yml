# Reusable Claude code review — the org-standard AI PR reviewer.
# Callers: see workflow-templates/claude-review.yml. Pass BEDROCK_API_KEY by name.
#
# Standards applied (psd-dev-standards/standards/03-code-review.md):
# - The review runs on every push to a PR: callers trigger on [opened,
#   synchronize, ready_for_review, reopened]. It is a required check on
#   production repos (psd-production ruleset), and its IMPORTANT findings are
#   fixed before merge where reasonable, not treated as advisory. Decision:
#   Kris, 2026-10-10. A review is not a human approval.
# - Cost: about $0.013 per review on Haiku 5.5, so a review per push stays at a
#   few dollars a month. The concurrency group below cancels a review that a
#   newer push supersedes.
# - Severity-tiered output, ≤5 nits, file:line evidence for behavior claims.
# - Model serving: Amazon Bedrock (us-west-2) with the org BEDROCK_API_KEY,
#   the same key and account OpenWiki uses, so spend lands on the district's
#   AWS bill. Decision: Kris, 2026-10-08. Until then reviews ran on a personal
#   CLAUDE_CODE_OAUTH_TOKEN; repo-level copies of that token overrode the org
#   one and failed every run in aistudio and psd-claude-plugins. The `global.`
#   inference profiles are blocked by SCP, so the model ID uses `us.`.
name: Reusable Claude Review

on:
  workflow_call:
    inputs:
      model:
        # Haiku 5.5 matched Sonnet 5.5 on 10 graded PRs (5 vs 4 real
        # defects, 1 wrong finding each) at ~1/8 the logged cost; decision
        # Kris, 2026-10-09. Every repo uses the default.
        description: "Bedrock model ID for review"
        type: string
        default: "us.anthropic.claude-haiku-5-5"
      max_turns:
        # 30 ran out on large PRs: psd-athletics#11 (+2,864 lines, 19 files)
        # and xcreds-psd (2026-09-14) both failed with error_max_turns.
        description: "Hard cap on agent turns"
        type: number
        default: 60
      extra_prompt:
        description: "Repo-specific review instructions appended to the standard prompt"
        type: string
        default: ""
    secrets:
      # The only secret this workflow reads. Callers pass it by name rather
      # than `secrets: inherit`, so the review job never receives the repo's
      # other secrets (decision: Kris, 2026-10-09). Callers still on
      # `inherit` keep working.
      BEDROCK_API_KEY:
        required: false

jobs:
  run:
    name: claude-review
    # No actor test here: a skipped job satisfies the required check, so a
    # skip must never stand in for a review. The caller routes Dependabot's own
    # PRs to reusable-claude-review-skip.yml; anything else that can't be
    # reviewed fails in the first step. Drafts can't merge, so skipping them
    # is safe.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Dependabot-triggered and fork runs get no BEDROCK_API_KEY, so they
      # can't be reviewed. Before this check the job skipped on
      # `github.actor == 'dependabot[bot]'`, and actor is the last pusher: a
      # fork PR that Dependabot later pushed to skipped and read as passed.
      - name: Refuse runs that can't be reviewed
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Can't review this run (actor $ACTOR, head repo $HEAD_REPO): no Bedrock key for Dependabot-triggered or fork runs. A human must review it; merge with an admin bypass."
            exit 1
          fi

      # Generated wiki PRs (openwiki/ only) aren't reviewed: they're capped to
      # docs, and a 38-file wiki rebuild ran the reviewer out of turns
      # (psd-device-repair-manager#13, 2026-10-08). Decision: Kris, 2026-10-08.
      - name: Skip OpenWiki-only PRs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          other=$(printf '%s\n' "$files" | grep -v -c '^openwiki/' || true)
          if [ -n "$files" ] && [ "$other" -eq 0 ]; then
            echo "Only openwiki/ changed; skipping review." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.scope.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: review
        if: steps.scope.outputs.skip != 'true'
        # With --json-schema the action fails this step when a review that
        # otherwise finished returns no count. That must not turn the check
        # red (standards/03 rule 6; Kris, 2026-11-25), so the step fails
        # softly and the publish step below decides: only that case passes,
        # and every other failure of this step still fails the job.
        continue-on-error: true
        # Sonnet 5.5 needs Claude Code >= 2.1.280. The version stays a bare comment
        # so Dependabot keeps it current; #68 left it at v1.0.265 on v1.0.269.
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        env:
          AWS_REGION: us-west-2
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
        with:
          use_bedrock: "true"
          allowed_bots: "dependabot"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            this repository per PSD engineering standards. Review only this
            pull request: read, discuss and comment on no other pull request
            or issue.

            Findings must be severity-tiered:
            - IMPORTANT (fix before merge): correctness bugs, security issues,
              data-handling problems, broken behavior. Behavior claims need
              file:line evidence.
            - NIT: style/minor. Maximum 5 nits; summarize the rest as a count.
            - Do not flag pre-existing issues outside this diff except security.

            Focus areas: correctness, security (secrets, injection, authz),
            student-data handling (FERPA — flag student data, as defined
            below, touching logs or external services), test quality (do new
            tests actually assert behavior?), and CI weakening (removed/skipped
            tests = IMPORTANT).

            What student data is (psd-dev-standards standard 04 rule 19, and
            standard 08's data classification mapping): what identifies a
            student — a name, a username, a student ID number or an email
            address — or a record that pairs one of those with the student's
            activity. A device identifier alone (MAC address, IP address,
            serial number) is NOT student data, including on a device
            assigned to one student: do not flag it and do not ask for a
            FERPA sign-off. A student username shown next to a device in
            operator output is normal operations; flag it only when it is
            committed to the repo.

            Also IMPORTANT, citing the rule (psd-dev-standards standard 04):
            - Rule 24: alert, digest, notification or chat-post code that
              interpolates a student's name field from a student record. A
              student username or ID number may appear only labeled (e.g.
              `Username: 1000123`) and only to district technology staff
              channels; a student name never.
            - Rule 25: security detection rules, or a security log search or
              analytics store used for detection (e.g. OpenSearch,
              Elasticsearch, Splunk or Security Lake queries/rules), outside
              CrowdStrike Falcon NG-SIEM. A log store used only as a feed,
              cache or measuring bench is fine.

            Use the repository's CLAUDE.md for conventions. If the diff is
            clean, say so briefly — do not invent findings.

            You cannot run code, tests, linters or builds here. Never say you
            ran them or report their results; say what you read instead.
            ${{ inputs.extra_prompt }}
            ${{ github.event.action == 'synchronize' && 'This is a re-review after new commits. Read your earlier review comment on this PR (gh pr view --comments). Post only IMPORTANT findings that are new or still unresolved, say which earlier IMPORTANT findings are now fixed, and skip nits.' || '' }}

            Use `gh pr comment ${{ github.event.pull_request.number }}` with
            your Bash tool to leave the review as a single PR comment. Read the
            PR with `gh pr view ${{ github.event.pull_request.number }}` and
            `gh pr diff ${{ github.event.pull_request.number }}`; those are the
            only gh commands you can run.

            After posting it, return important_open: the number of IMPORTANT
            findings your comment reports as new or still unresolved (on a
            first review, every IMPORTANT finding; 0 when there are none).
            Earlier findings now fixed and nits don't count.
          # Every allowed gh command is bound to this event's PR number. A
          # canary review of one PR (psd-standards-canary#38, 2026-11-25) also
          # posted a review on another (#39) through the old unbound
          # `gh pr comment:*`; Kris ruled the reviewer is locked to its own PR
          # (2026-11-25). `gh pr list`, `gh issue view/list` and `gh search`
          # are gone: each can read another PR. Claude Code matches `X:*` as
          # `X *` (a space after the number, so 38 doesn't match 380) and
          # checks each part of a compound command on its own
          # (code.claude.com/docs/en/permissions, read 2026-11-25). Unlisted
          # commands are denied because allowed_bots keeps the action out of
          # auto mode (src/modes/permission-mode.ts at the pinned SHA).
          # --json-schema makes the result a validated structured_output, which
          # the next step publishes, so the verdict is read as data, not prose.
          claude_args: >-
            --model ${{ inputs.model }} --max-turns ${{ inputs.max_turns }}
            --allowed-tools "Bash(gh pr comment ${{ github.event.pull_request.number }}:*),Bash(gh pr diff ${{ github.event.pull_request.number }}:*),Bash(gh pr view ${{ github.event.pull_request.number }}:*)"
            --json-schema '{"type":"object","properties":{"important_open":{"type":"integer","minimum":0}},"required":["important_open"],"additionalProperties":false}'

      # One annotation on this check run carries the verdict: the count of
      # IMPORTANT findings open, skipped-openwiki, or error when the review
      # returned no valid count. A tool reads it through the check-run
      # annotations API instead of parsing the comment. Only the validated
      # number is printed, never model text a PR can steer. This step never
      # fails the job on findings (standards/03 rule 6). It also passes a
      # review that finished but returned no count: the action's own result
      # message (subtype success, not is_error, within max_turns) shows that
      # was the only failure. Any other failure of the review step fails the
      # job here, as it did before the step failed softly.
      - name: Publish IMPORTANT count
        if: ${{ !cancelled() }}
        env:
          SKIP: ${{ steps.scope.outputs.skip }}
          VERDICT: ${{ steps.review.outputs.structured_output }}
          OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          if [ "$SKIP" = "true" ]; then
            n=skipped-openwiki
          else
            n=$(printf '%s' "$VERDICT" | jq -r '
              if type == "object"
                and keys == ["important_open"]
                and (.important_open | type) == "number"
                and .important_open >= 0 and .important_open < 1000
                and .important_open == (.important_open | floor)
              then .important_open | floor
              else "error" end' 2>/dev/null) || n=error
            case "$n" in "" | *[!0-9]*) n=error ;; esac
          fi
          echo "::notice title=claude-review-important::$n"
          if [ "$OUTCOME" = "failure" ]; then
            finished=false
            if [ "$n" = "error" ] && [ -f "$EXECUTION_FILE" ] && jq -e --argjson max "$MAX_TURNS" '
                [.[] | select(type == "object" and .type == "result")] | last
                | type == "object" and .subtype == "success" and .is_error == false
                  and (.num_turns | type) == "number" and .num_turns <= $max
              ' "$EXECUTION_FILE" >/dev/null 2>&1; then
              finished=true
            fi
            if [ "$finished" = "true" ]; then
              echo "The review finished but returned no IMPORTANT count; the check passes (standards/03 rule 6)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Run Claude Code Review failed; see that step's log." >&2
              exit 1
            fi
          fi
