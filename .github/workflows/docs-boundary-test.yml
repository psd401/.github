# ABOUTME: Runs the docs boundary script's offline tests on PRs that change it.
name: docs-boundary-test
on:
  pull_request:
    paths:
      - scripts/docs_boundary.py
      - scripts/test_docs_boundary.py
      - .github/workflows/docs-boundary-test.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -I scripts/test_docs_boundary.py
