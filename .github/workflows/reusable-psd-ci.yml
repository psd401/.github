# Reusable CI — the org-standard build/lint/typecheck/test gate (`psd-ci`).
# Detects the package manager from the lockfile; repos override commands via
# inputs only when their scripts deviate from the standard names.
#
# Hardening note: workflow inputs are passed to bash exclusively via `env:`,
# never `${{ }}`-interpolated into script bodies — raw interpolation is both
# an injection surface and a syntax hazard when inputs are empty (caught by
# the canary repo, 2026-08-14).
name: Reusable PSD CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      install-command:
        type: string
        default: ""
      runtime-standard-mode:
        description: "Org runtime standard (bun/uv) enforcement: warn | fail | off (off = documented exemption, e.g. vendor fork)"
        type: string
        default: "warn"
      lint-command:
        type: string
        default: "auto"   # runs `lint` script if present
      typecheck-command:
        type: string
        default: "auto"   # runs `typecheck` script if present
      build-command:
        type: string
        default: "auto"   # runs `build` script if present
      test-command:
        type: string
        default: "auto"   # runs `test` script if present; a repo with no tests FAILS (standards/05-testing.md)
      allow-no-tests:
        description: "Tier C escape hatch only"
        type: boolean
        default: false
      secret-scan-mode:
        description: "gitleaks full-history secret scan: warn | fail | off. Free replacement for paid GitHub Secret Protection on private repos (standards ROADMAP Phase 0, 2026-09-25)"
        type: string
        default: "warn"

jobs:
  run:
    name: psd-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect package manager
        id: pm
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then pm=bun
          elif [ -f pnpm-lock.yaml ]; then pm=pnpm
          elif [ -f yarn.lock ]; then pm=yarn
          elif [ -f package-lock.json ]; then pm=npm
          elif [ -f package.json ]; then pm=npm-nolock
          elif [ -f uv.lock ] || [ -f pyproject.toml ]; then pm=uv
          else pm=none
          fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "Detected: $pm"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: contains(fromJSON('["npm","npm-nolock","pnpm","yarn"]'), steps.pm.outputs.pm)
        with:
          node-version: ${{ inputs.node-version }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.pm.outputs.pm == 'bun'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.pm.outputs.pm == 'uv'

      - name: Runtime standard (bun for JS/TS, uv for Python — standards/02)
        env:
          MODE: ${{ inputs.runtime-standard-mode }}
        run: |
          [ "$MODE" = "off" ] && { echo "runtime standard: exempt (documented)"; exit 0; }
          bad=""
          [ -f package-lock.json ] && bad="package-lock.json (org standard: bun — run 'bun install', commit bun.lock, delete package-lock.json)"
          [ -f pnpm-lock.yaml ] && bad="pnpm-lock.yaml (org standard: bun)"
          [ -f yarn.lock ] && bad="yarn.lock (org standard: bun)"
          if [ -z "$bad" ] && [ -f requirements.txt ] && [ ! -f uv.lock ] && [ ! -f pyproject.toml ]; then
            bad="requirements.txt without pyproject/uv.lock (org standard: uv — see standards/02)"
          fi
          [ -f Pipfile ] && bad="Pipfile (org standard: uv)"
          [ -f poetry.lock ] && bad="poetry.lock (org standard: uv)"
          if [ -n "$bad" ]; then
            if [ "$MODE" = "fail" ]; then echo "::error::Runtime standard violation: $bad"; exit 1;
            else echo "::warning::Runtime standard violation (will hard-fail after the conversion wave): $bad"; fi
          else
            echo "runtime standard: compliant"
          fi

      - name: Install
        env:
          PM: ${{ steps.pm.outputs.pm }}
          INSTALL_CMD: ${{ inputs.install-command }}
        run: |
          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
            exit $?
          fi
          case "$PM" in
            bun) bun install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            npm-nolock) npm install ;;
            uv) uv sync --frozen 2>/dev/null || { [ -f requirements.txt ] && uv pip install --system -r requirements.txt || echo "no deps to install"; } ;;
            none) echo "no dependencies" ;;
          esac

      - name: Run gate
        env:
          PM: ${{ steps.pm.outputs.pm }}
          LINT_CMD: ${{ inputs.lint-command }}
          TYPECHECK_CMD: ${{ inputs.typecheck-command }}
          BUILD_CMD: ${{ inputs.build-command }}
          TEST_CMD: ${{ inputs.test-command }}
          ALLOW_NO_TESTS: ${{ inputs.allow-no-tests }}
        run: |
          set -e
          has_script() { [ -f package.json ] && node -e "process.exit((require('./package.json').scripts||{})['$1'] ? 0 : 1)"; }
          runcmd() {
            case "$PM" in
              bun) bun run "$1" ;;
              pnpm) pnpm run "$1" ;;
              yarn) yarn "$1" ;;
              npm|npm-nolock) npm run "$1" ;;
              *) echo "no runner for $PM"; return 1 ;;
            esac
          }
          uv_auto() { # $1=step-name — uv repos: run ruff/mypy/pyright when configured
            case "$1" in
              lint)
                if grep -qE '\[tool\.ruff|^ruff' pyproject.toml 2>/dev/null || [ -f ruff.toml ]; then
                  echo "== lint (ruff)"; uv run ruff check .
                else echo "== lint: no ruff config, skipped"; fi ;;
              typecheck)
                if grep -q '\[tool\.mypy\]' pyproject.toml 2>/dev/null || [ -f mypy.ini ]; then
                  echo "== typecheck (mypy)"; uv run mypy .
                elif grep -q '\[tool\.pyright\]' pyproject.toml 2>/dev/null || [ -f pyrightconfig.json ]; then
                  echo "== typecheck (pyright)"; uv run pyright
                else echo "== typecheck: no config, skipped"; fi ;;
              *) echo "== $1: skipped for uv" ;;
            esac
          }
          step() { # $1=script-name $2=configured-command
            if [ "$2" = "auto" ]; then
              if [ "$PM" = "uv" ]; then uv_auto "$1";
              elif has_script "$1"; then echo "== $1"; runcmd "$1";
              else echo "== $1: no script, skipped"; fi
            elif [ -n "$2" ]; then
              echo "== $1 (custom)"; eval "$2"
            fi
          }
          step lint "$LINT_CMD"
          step typecheck "$TYPECHECK_CMD"
          step build "$BUILD_CMD"
          if [ "$TEST_CMD" = "auto" ]; then
            if has_script test; then
              echo "== test"; runcmd test
            elif [ "$PM" = "uv" ] && { [ -d tests ] || ls test_*.py > /dev/null 2>&1; }; then
              echo "== test (pytest)"; uv run pytest
            elif [ "$ALLOW_NO_TESTS" = "true" ]; then
              echo "::warning::No tests found (allowed: Tier C escape hatch)"
            else
              echo "::error::No test script found. Every Tier A/B repo needs tests (standards/05-testing.md)."
              exit 1
            fi
          elif [ -n "$TEST_CMD" ]; then
            echo "== test (custom)"; eval "$TEST_CMD"
          fi

  # Separate job so findings never break the required `psd-ci` check while in
  # warn mode; surfaces as the `secret-scan` check. Pinned, checksum-verified
  # CLI per standards/04 (never a convenience action).
  secret-scan:
    name: secret-scan
    if: inputs.secret-scan-mode != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: a secret deleted at HEAD is still leaked

      - name: gitleaks (full history, redacted)
        env:
          MODE: ${{ inputs.secret-scan-mode }}
          GITLEAKS_VERSION: "8.24.0"
          GITLEAKS_SHA256: "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4" # gitleaks_8.24.0_checksums.txt
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gl.tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          rc=0
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 2 . || rc=$?
          case "$rc" in
            0) echo "secret scan: no findings" ;;
            2) if [ "$MODE" = "fail" ]; then echo "::error::gitleaks found potential secrets (redacted above). Rotate first, then remove or allowlist."; exit 1
               else echo "::warning::gitleaks found potential secrets (redacted above). Rotate first; this check will hard-fail after the cleanup wave."; fi ;;
            *) echo "::error::gitleaks did not run cleanly (exit $rc)"; exit 1 ;;
          esac
