# Smoke test for reusable-openwiki.yml: runs the PR's version of the reusable
# against psd401/psd-standards-canary with dry_run (no PR, no app token),
# twice: updating the canary's committed wiki, and building one from scratch.
# Every OpenWiki pin bump or model change must pass this before merge,
# because all callers use the reusable at @main.
name: OpenWiki smoke test

on:
  pull_request:
    paths:
      - .github/workflows/reusable-openwiki.yml
      - .github/workflows/openwiki-smoke.yml
      # The locked CLI version; a pin bump must pass this before merge.
      - tools/openwiki/**
  # Manual model test against any repo (dry run: nothing is pushed), e.g.
  # repository=psd401/proxmox-mcp model=us.anthropic.claude-sonnet-5-5.
  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to build (owner/name)"
        type: string
        default: psd401/psd-standards-canary
      branch:
        description: "Branch to build"
        type: string
        default: main
      model:
        description: "Model or inference-profile ID (empty = the reusable's default)"
        type: string
        default: ""
      from_scratch:
        description: "Build from scratch (false = update the repo's committed wiki)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  canary:
    # Both paths, because 0.7.1 passed a first build and failed every update
    # of an existing wiki (2026-10-08).
    strategy:
      fail-fast: false
      matrix:
        # A manual run builds one path: from scratch (model test) or an update.
        from_scratch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.from_scratch) || '[true, false]') }}
    permissions:
      contents: read
      pull-requests: read
    # ./ rather than the self-repository $/ form zizmor suggests: GitHub runs
    # $/ (the smoke test passed with it on #87, 2026-11-23), but actionlint
    # 1.7.12, the latest, rejects it as an invalid reusable workflow call.
    uses: ./.github/workflows/reusable-openwiki.yml  # zizmor: ignore[self-repository]
    with:
      repository: ${{ inputs.repository || 'psd401/psd-standards-canary' }}
      base_branch: ${{ inputs.branch || 'main' }}
      # Empty on pull_request runs; an empty value would override the
      # reusable's Sonnet first-build default with Haiku, which leaves empty
      # wikis (the from_scratch canary failed this way on PR #30, 2026-10-22).
      first_build_model_id: ${{ inputs.model || 'us.anthropic.claude-sonnet-5-5' }}
      dry_run: true
      from_scratch: ${{ matrix.from_scratch }}
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
