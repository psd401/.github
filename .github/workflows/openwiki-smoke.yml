# Smoke test for reusable-openwiki.yml: runs the PR's version of the reusable
# against psd401/psd-standards-canary with dry_run (no PR, no app token),
# twice: updating the canary's committed wiki, and building one from scratch.
# Every OpenWiki pin bump or model change must pass this before merge,
# because all callers use the reusable at @main.
name: OpenWiki smoke test

on:
  pull_request:
    paths:
      - .github/workflows/reusable-openwiki.yml
      - .github/workflows/openwiki-smoke.yml
  # Manual model test against any repo (dry run: nothing is pushed), e.g.
  # repository=psd401/proxmox-mcp model=us.anthropic.claude-sonnet-5-5.
  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to build (owner/name)"
        type: string
        default: psd401/psd-standards-canary
      branch:
        description: "Branch to build"
        type: string
        default: main
      model:
        description: "Model or inference-profile ID (empty = the reusable's default)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  canary:
    # Both paths, because 0.7.1 passed a first build and failed every update
    # of an existing wiki (2026-10-08).
    strategy:
      fail-fast: false
      matrix:
        # A manual model test only needs the first build.
        from_scratch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[true]' || '[true, false]') }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-openwiki.yml
    with:
      repository: ${{ inputs.repository || 'psd401/psd-standards-canary' }}
      base_branch: ${{ inputs.branch || 'main' }}
      first_build_model_id: ${{ inputs.model }}
      dry_run: true
      from_scratch: ${{ matrix.from_scratch }}
    secrets: inherit # zizmor: ignore[secrets-inherit] same-repo reusable; needs BEDROCK_API_KEY
