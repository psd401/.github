# ABOUTME: Runs the plugin publish scripts' tests on PRs that change them or the publish workflow.
# ABOUTME: Every caller uses reusable-publish-plugin.yml at @main, so changes must pass here before merge.
name: Publish plugin tests

on:
  pull_request:
    paths:
      - scripts/publish-plugin.sh
      - scripts/publish-plugin.test.sh
      - scripts/requires-pull-requests.sh
      - scripts/requires-pull-requests.test.sh
      - scripts/validate-marketplace.sh
      - scripts/validate-marketplace.test.sh
      - tools/claude-code/**
      - .github/workflows/reusable-publish-plugin.yml
      - .github/workflows/publish-plugin-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/publish-plugin.test.sh
      - run: bash scripts/requires-pull-requests.test.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bash scripts/validate-marketplace.test.sh
