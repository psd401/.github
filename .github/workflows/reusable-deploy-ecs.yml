# Reusable deploy to ECS Fargate: build the app image, push it to ECR,
# register a task definition revision with the new image, run database
# migrations as a one-off task, then roll the service and wait for it to be
# stable. Built for apps whose infrastructure is in Terraform
# (psd-dev-standards 08 v0.2), first used by psd-athletics.
#
# Security: AWS access is only through the caller's OIDC deploy role (no
# stored keys). The job runs in a GitHub environment, so environment
# protection (required reviewers) gates every deploy, and the role's trust
# policy should pin `repo:<owner>/<repo>:environment:<name>`.
#
# Hardening: inputs reach bash only through `env:`, never `${{ }}` in
# script bodies (see reusable-psd-ci.yml).
name: Reusable deploy to ECS

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment that gates the deploy (its protection rules apply)"
        type: string
        default: "production"
      aws-region:
        type: string
        default: "us-west-2"
      role-to-assume:
        description: "Deploy role ARN (OIDC). Its trust policy should pin this repo and environment."
        type: string
        required: true
      ecr-repository:
        description: "ECR repository name (not URL)"
        type: string
        required: true
      ecs-cluster:
        type: string
        required: true
      ecs-service:
        type: string
        required: true
      task-definition-family:
        type: string
        required: true
      container-name:
        type: string
        default: "app"
      dockerfile:
        type: string
        default: "Dockerfile"
      platform:
        description: "Image platform; the runner should match (ubuntu-24.04-arm for linux/arm64)"
        type: string
        default: "linux/arm64"
      runner:
        type: string
        default: "ubuntu-24.04-arm"
      migrate-command:
        description: 'JSON array run as a one-off task before the service rolls, e.g. ["bun","run","db:migrate"]. Empty to skip.'
        type: string
        default: ""
      subnets:
        description: "Comma-separated subnet ids for the one-off task (required with migrate-command)"
        type: string
        default: ""
      security-groups:
        description: "Comma-separated security group ids for the one-off task"
        type: string
        default: ""
      assign-public-ip:
        description: "ENABLED or DISABLED for the one-off task"
        type: string
        default: "DISABLED"

permissions: {}

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.ecs-service }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: deploy-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.ecr-repository }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORM: ${{ inputs.platform }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$REPOSITORY:$SHA"
          docker buildx build --platform "$PLATFORM" --file "$DOCKERFILE" --tag "$image" --push .
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Register a task definition revision with the new image
        id: taskdef
        env:
          FAMILY: ${{ inputs.task-definition-family }}
          CONTAINER: ${{ inputs.container-name }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > current.json
          jq --arg c "$CONTAINER" --arg i "$IMAGE" '
            (.containerDefinitions[] | select(.name == $c) | .image) = $i
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' current.json > next.json
          if ! jq -e --arg c "$CONTAINER" '.containerDefinitions | any(.name == $c)' next.json > /dev/null; then
            echo "::error::No container named $CONTAINER in $FAMILY"; exit 1
          fi
          arn=$(aws ecs register-task-definition --cli-input-json file://next.json --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Registered $arn"

      - name: Run migrations as a one-off task
        if: inputs.migrate-command != ''
        env:
          CLUSTER: ${{ inputs.ecs-cluster }}
          TASKDEF: ${{ steps.taskdef.outputs.arn }}
          CONTAINER: ${{ inputs.container-name }}
          COMMAND: ${{ inputs.migrate-command }}
          SUBNETS: ${{ inputs.subnets }}
          SECURITY_GROUPS: ${{ inputs.security-groups }}
          PUBLIC_IP: ${{ inputs.assign-public-ip }}
        run: |
          set -euo pipefail
          if [ -z "$SUBNETS" ] || [ -z "$SECURITY_GROUPS" ]; then
            echo "::error::migrate-command needs subnets and security-groups"; exit 1
          fi
          echo "$COMMAND" | jq -e 'type == "array" and all(type == "string")' > /dev/null || { echo "::error::migrate-command must be a JSON array of strings"; exit 1; }
          overrides=$(jq -n --arg c "$CONTAINER" --argjson cmd "$COMMAND" '{containerOverrides: [{name: $c, command: $cmd}]}')
          network=$(jq -n --arg s "$SUBNETS" --arg g "$SECURITY_GROUPS" --arg p "$PUBLIC_IP" \
            '{awsvpcConfiguration: {subnets: ($s | split(",")), securityGroups: ($g | split(",")), assignPublicIp: $p}}')
          task=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASKDEF" --launch-type FARGATE \
            --network-configuration "$network" --overrides "$overrides" --started-by "migrate-$GITHUB_RUN_ID" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task $task"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query "tasks[0].containers[?name=='$CONTAINER'].exitCode | [0]" --output text)
          if [ "$code" != "0" ]; then echo "::error::Migrations exited with $code; the service was not changed"; exit 1; fi
          echo "Migrations finished"

      - name: Roll the service and wait until it's stable
        env:
          CLUSTER: ${{ inputs.ecs-cluster }}
          SERVICE: ${{ inputs.ecs-service }}
          TASKDEF: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASKDEF" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$SERVICE now runs \`$TASKDEF\`" >> "$GITHUB_STEP_SUMMARY"
