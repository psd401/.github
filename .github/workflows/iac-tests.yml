# ABOUTME: Runs the scripts/iac/ pytest suite, conftest verify and the action-pin check on PRs that change workflows or the IaC files.
# ABOUTME: Callers pin the IaC reusables to a release SHA, so changes must pass here before a release.
name: IaC reusable tests

on:
  pull_request:
    paths:
      # Every workflow and starter template: the action-pins job scans them all.
      - .github/workflows/**
      - workflow-templates/**
      - .github/actionlint.yaml
      - policy/**
      - schemas/iac/**
      - scripts/iac/**
      - tools/iac/**
      - modules/**
      - templates/account-baseline/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test deps (hash-locked)
        run: |
          python3 -m venv "$RUNNER_TEMP/iac-test-venv"
          "$RUNNER_TEMP/iac-test-venv/bin/pip" install --quiet --require-hashes -r tools/iac/requirements-test.txt
      # Both installers check the release tarball against a pinned SHA-256
      # and append their bin directory to GITHUB_PATH.
      - name: Install age and conftest (pinned, SHA-256 checked)
        run: |
          bash scripts/iac/install_age.sh "$RUNNER_TEMP/age-bin"
          bash scripts/iac/install_conftest.sh "$RUNNER_TEMP/conftest-bin"
      # REQUIRE_AGE=1 turns test_plan_seal.py's "age not on PATH" skip into a failure.
      - name: pytest
        env:
          REQUIRE_AGE: "1"
        run: '"$RUNNER_TEMP/iac-test-venv/bin/python" -m pytest -p no:cacheprovider scripts/iac -v'
      - name: conftest verify (policy unit tests)
        run: |
          for platform in aws gcp onprem; do
            conftest verify --policy "policy/conftest/$platform" --data "policy/conftest/fixtures/$platform"
          done

  # Every SHA-pinned `uses:` in this repo's workflows and starter templates
  # must exist at its SHA and must not declare a removed Node runtime.
  # actionlint and zizmor read only the calling file, so a pin to a missing
  # path (an infracost/actions/comment pin, 2026-10-22) passes both.
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pinned action targets
        run: >-
          python3 scripts/iac/check_action_pins.py
          .github/workflows/*.yml
          workflow-templates/*.yml

  # Offline: tests/baseline.tftest.hcl mocks the aws provider, so no AWS
  # credentials. Same setup-terraform pin and version as reusable-iac-checks.yml.
  # -lockfile=readonly fails the job if the committed lock (aws 6.68.0) drifts.
  baseline-module-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: terraform init
        working-directory: modules/student-pii-account-baseline
        run: terraform init -input=false -backend=false -lockfile=readonly
      - name: terraform test
        working-directory: modules/student-pii-account-baseline
        run: terraform test
