# ABOUTME: actionlint config: declares the custom proxmox runner label and ignores the
# ABOUTME: job.workflow_* properties actionlint 1.7.12 doesn't know yet (reusables only).
self-hosted-runner:
  labels:
    - proxmox
paths:
  .github/workflows/reusable-*.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
      - 'property "workflow_repository" is not defined in object type'
