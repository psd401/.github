name: OpenWiki Update
on:
  workflow_dispatch:
  push:
    branches: [$default-branch]
  schedule:
    - cron: "0 8 * * 1"
jobs:
  openwiki:
    permissions:
      contents: write # caller must grant; org default token is read-only and reusables cannot elevate
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@main
    with:
      base_branch: $default-branch
    secrets: inherit
