name: OpenWiki Update
on:
  workflow_dispatch:
  # No push trigger: since v1.2.1 the reusable skips push runs unless the
  # caller passes run_on_push: true, so the Monday run rebuilds the wiki.
  schedule:
    - cron: "0 8 * * 1"
jobs:
  openwiki:
    permissions:
      contents: read # the reusable only reads with GITHUB_TOKEN; writes use the psd-automation App
      pull-requests: read
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@c514b542fcfb4b2ed70878cd837bd9ec3571cad1 # v1.22.0
    with:
      base_branch: $default-branch
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
