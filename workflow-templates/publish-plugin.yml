# ABOUTME: Publishes this repo's Claude Code plugin to the PSD plugin marketplace when its plugin.json changes on the default branch.
# ABOUTME: A release is a PR that bumps "version" in plugin.json; plugin changes merged before it ship with it.
name: Publish plugin
on:
  workflow_dispatch:
  push:
    branches: [$default-branch]
    # The plugin's plugin.json, so plugin changes can merge and wait for a release PR
    # that bumps its version; the publish refuses a plugin.json change without a bump.
    # Set plugin_path below to the folder holding .claude-plugin/.
    paths:
      - "plugin/.claude-plugin/plugin.json"
jobs:
  publish:
    permissions:
      contents: read # the reusable only reads with GITHUB_TOKEN; writes use the psd-automation App
    uses: PSD401/.github/.github/workflows/reusable-publish-plugin.yml@85ef062e6ec4492a075c731211c9fe405fa4c6cc # v1.2.0
    with:
      plugin_path: plugin
      category: productivity
    secrets:
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
