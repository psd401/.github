name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # caller must grant; org default token is read-only and reusables cannot elevate
    # Dependabot-triggered callers cannot grant id-token: write to the
    # reusable — startup_failure. Only a PR Dependabot opened, pushed last, in
    # this repo goes to the no-op below; testing actor alone let a fork PR
    # that Dependabot pushed to pass unreviewed. Anything else fails in the
    # reusable rather than skipping.
    if: ${{ !(github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@9b1afe0d9fc34cb6f5427179854ebf7852a1c748 # v1.2.1
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
  # Dependabot PRs aren't reviewed, but production repos require a
  # `claude-review / claude-review` check, and the skipped job above reports
  # only `claude-review`. This job has the same name and calls a no-op
  # reusable, so the required context passes.
  claude-review-dependabot:
    name: claude-review
    permissions: {}
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    uses: PSD401/.github/.github/workflows/reusable-claude-review-skip.yml@9b1afe0d9fc34cb6f5427179854ebf7852a1c748 # v1.2.1
