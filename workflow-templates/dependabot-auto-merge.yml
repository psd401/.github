# Turns on auto-merge for a Dependabot PR whose every update is a patch to a
# development dependency (standards/04-security.md rule 4). GitHub merges it
# once the required checks pass. Every other PR waits for a person.
# Set merge_method to a method this repo allows: merge, squash or rebase.
name: Dependabot auto-merge
"on": pull_request
permissions: {}
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-dependabot-auto-merge.yml@6822f7d0118ab90f38d1c060311786d36379fbb1 # v1.21.1
    with:
      merge_method: squash
