name: Security Scan
on:
  pull_request:
  # The one check that keeps push: a direct push to the default branch gets its
  # secret scan at once (psd-dev-standards standards/06 §4, Runner minutes).
  push:
    branches: [$default-branch]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@53bd9c84e4630cbe0a8cf32c18eb1227b5f70ae5 # v1.14.1
