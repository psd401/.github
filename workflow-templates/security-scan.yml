name: Security Scan
on:
  pull_request:
  # The one check that keeps push: a direct push to the default branch gets its
  # secret scan at once (psd-dev-standards standards/06 §4, Runner minutes).
  push:
    branches: [$default-branch]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@56fc2906c0e3b0467709fbf728b10ef780b17944 # v1.8.0
