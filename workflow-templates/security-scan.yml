name: Security Scan
on:
  pull_request:
  # The one check that keeps push: a direct push to the default branch gets its
  # secret scan at once (psd-dev-standards standards/06 §4, Runner minutes).
  push:
    branches: [$default-branch]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@fee7c33b6f3f1d4cb522d9a1241862da643d3874 # v1.23.0
