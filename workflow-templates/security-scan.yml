name: Security Scan
on:
  pull_request:
  # The one check that keeps push: a direct push to the default branch gets its
  # secret scan at once (psd-dev-standards standards/06 §4, Runner minutes).
  push:
    branches: [$default-branch]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@02b00cb893a52fed788fc793bc78a31f5b977a9e # v1.22.3
