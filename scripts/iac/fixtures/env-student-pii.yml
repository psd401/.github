# Test fixture only: fake values in a valid environment-file shape, with
# cloud.aws.student_pii. Hosts are example.internal.
district_id: testdistrict
network:
  vlans:
    management: {id: 10, subnet: 192.0.2.0/24, allowed_data_classifications: [internal]}
    workload: {id: 20, subnet: 198.51.100.0/24, allowed_data_classifications: [internal, student-pii]}
    storage: {id: 30, subnet: 203.0.113.0/24, allowed_data_classifications: [internal, student-pii]}
  dns_zones:
    internal: example.internal
  ca:
    internal_root: Example Internal Root CA
  syslog_target: syslog.example.internal:514
  ntp_servers: [ntp1.example.internal, ntp2.example.internal]
timezone: America/Los_Angeles
patch_window: Sun 02:00-04:00
monitoring:
  zabbix_server: zabbix.example.internal
virtualization:
  proxmox_api_endpoint: https://pve.example.internal:8006
  cluster_name: pve-test
  resource_pools:
    vm-repo: pool-vm-repo
  vmid_ranges:
    templates: 9000-9099
cloud:
  aws:
    state_bucket_prefix: psd-tfstate
    account_alias:
      prod: prod-alias
      nonprod: nonprod-alias
      sandbox: sandbox-alias
    region_default: us-west-2
    region_ai: us-east-1
    alerts_topic_name: psd-alerts
    bedrock_default_model_id: anthropic.claude-x
    student_pii:
      regions: [us-west-2]
      guardrail_mode: organization
      breakglass_role_name: district-breakglass-unmask
      breakglass_permission_set_name: StudentPiiBreakGlass
      managed_identifiers:
        - arn:aws:dataprotection::aws:data-identifier/Name
        - arn:aws:dataprotection::aws:data-identifier/EmailAddress
        - arn:aws:dataprotection::aws:data-identifier/Address
      custom_identifiers:
        - name: StudentId
          regex: "\\bS[0-9]{7}\\b"
          test_matches: ["S1234567"]
          test_non_matches: ["S12345"]
  gcp:
    state_backend: gcs
    project_id:
      prod: gcp-prod-project
      nonprod: gcp-nonprod-project
oidc:
  deploy_role_prefix: psd-deploy
operations:
  change_request_system: freshservice
contacts:
  iac_owner_role: infrastructure engineer
