# ABOUTME: Placeholder instance of schemas/iac/environment-file.schema.json; every value is a <token>.
# ABOUTME: A real <district-id>.env.yml lives in a private repo, never here (scripts/iac tests read this).
# A real district file is resolved via PSD_ENV_FILE. See psd-dev-standards
# standards/08-iac.md 'Private environment file'.
district_id: <district-id>
network:
  vlans:
    management: {id: <management-vlan-id>, subnet: <management-subnet-cidr>, allowed_data_classifications: [internal]}
    workload: {id: <workload-vlan-id>, subnet: <workload-subnet-cidr>, allowed_data_classifications: [internal, student-pii]}
    storage: {id: <storage-vlan-id>, subnet: <storage-subnet-cidr>, allowed_data_classifications: [internal, student-pii]}
  dns_zones:
    internal: <internal-zone-name>
  ca:
    internal_root: <ca-name-or-path>
  syslog_target: <syslog-host-or-endpoint>
  ntp_servers:
    - <ntp-server-1>
    - <ntp-server-2>
timezone: <iana-tz-name>
patch_window: <patch-window>
monitoring:
  zabbix_server: <zabbix-endpoint>
virtualization:
  proxmox_api_endpoint: <proxmox-api-url>
  cluster_name: <cluster-name>
  resource_pools:
    <repo-name>: <pool-name>
  vmid_ranges:
    templates: <vmid-range-templates>
  bridge_availability:
    <node-name>: [<bridge-name-1>, <bridge-name-2>]
cloud:
  aws:
    state_bucket_prefix: <state-bucket-prefix>
    account_alias:
      prod: <prod-account-alias>
      nonprod: <nonprod-account-alias>
      sandbox: <sandbox-account-alias>
    region_default: <aws-region-default>
    region_ai: <aws-region-ai>
    alerts_topic_name: <alerts-topic-name>
    bedrock_default_model_id: <bedrock-default-model-id>
  gcp:
    state_backend: gcs
    project_id:
      prod: <gcp-project-id-prod>
      nonprod: <gcp-project-id-nonprod>
oidc:
  deploy_role_prefix: <deploy-role-prefix>
operations:
  change_request_system: <change-request-system>
  pbs_backup_schedule: <pbs-backup-schedule>
contacts:
  iac_owner_role: <iac-owner-role-title>
